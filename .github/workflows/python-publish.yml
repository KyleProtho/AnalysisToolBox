# Publishes analysistoolbox to PyPI when the version in setup.py changes on master.
# Requires a PYPI_API_TOKEN secret set in: GitHub repo → Settings → Secrets → Actions

name: Upload Python Package

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'setup.py'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Check if version changed
      id: check_version
      run: |
        CURRENT=$(python -c "import re; m = re.search(r\"version=['\\\"]([^'\\\"]+)['\\\"]\", open('setup.py').read()); print(m.group(1))")
        PREVIOUS=$(git show HEAD~1:setup.py 2>/dev/null | python -c "import re,sys; m = re.search(r\"version=['\\\"]([^'\\\"]+)['\\\"]\", sys.stdin.read()); print(m.group(1) if m else '')" || echo "")
        echo "current=$CURRENT" >> $GITHUB_OUTPUT
        echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
        if [ "$CURRENT" != "$PREVIOUS" ]; then
          echo "should_publish=true" >> $GITHUB_OUTPUT
          echo "Version changed: $PREVIOUS → $CURRENT"
        else
          echo "should_publish=false" >> $GITHUB_OUTPUT
          echo "Version unchanged ($CURRENT), skipping publish"
        fi

    - name: Install build tools
      if: steps.check_version.outputs.should_publish == 'true'
      run: pip install --upgrade build twine

    - name: Build package
      if: steps.check_version.outputs.should_publish == 'true'
      run: python -m build

    - name: Publish to PyPI
      if: steps.check_version.outputs.should_publish == 'true'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*
